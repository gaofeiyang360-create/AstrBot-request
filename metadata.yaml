name: astrbot_plugin_http_client
desc: 像Postman一样发起自定义HTTP请求
help: |
  指令：/http <METHOD> <URL> [headers_json] [body_json]
  示例：
    /http GET https://api.github.com
    /http POST https://httpbin.org/post {"Content-Type":"application/json"} {"key":"value"}
  支持的方法：GET, POST, PUT, PATCH, DELETE
version: v1.0.0
author: YourName
repo: https://github.com/your_username/astrbot_plugin_http_client
dependencies: []   # 此插件不需要额外依赖（httpx 会在 requirements.txt 中管理）
